<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi Sitio Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container">
        <h1>Contáctanos</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <section class="hero">
        <h2>Envíanos un mensaje</h2>
        <form action="#" class="contact-form">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" placeholder="Tu nombre completo" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="tu@correo.com" required>
            </div>
            
            <div class="form-group">
                <label>¿Qué problema presentas?</label><br>
                <label class="check-label"><input type="checkbox" name="error" value="1"> No me deja entrar</label><br>
                <label class="check-label"><input type="checkbox" name="error" value="2"> No abre</label><br>
                <label class="check-label"><input type="checkbox" name="error" value="3"> Me está fallando</label>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" rows="4" placeholder="¿En qué podemos ayudarte?" required></textarea>
            </div>
            
            <button type="submit" class="btn">Enviar Mensaje</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

        <div class="whatsapp-section">
            <p>¿Prefieres una respuesta inmediata?</p>
            <a href="https://wa.me/+573112530899?text=Hola" target="_blank" class="btn-whatsapp">
                Chatear por WhatsApp
            </a>
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 Mi Sitio Web Creativo</p>
    </div>
</footer>

</body>
</html>
